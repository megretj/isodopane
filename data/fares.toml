# ZVV single-ticket prices (Einzelbillette), adult, in CHF.
#
# Transcribed by hand from zvv.ch -> Abos und Tickets -> Einzelbillette.
# "reduced" = children 6-15.99 and Halbtax holders.
#
# RE-VERIFY AND RE-DATE BEFORE SHIPPING: ZVV revises fares at the December
# timetable change. Never edit these numbers to make a `validate` fixture pass —
# a mismatch is a bug in the graph or zone assignment.

valid_from = "2025-12-14"
source = "https://www.zvv.ch/zvv/de/abos-und-tickets/tickets/einzelbillette.html"

